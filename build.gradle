plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask

def modVersion = project.hasProperty('mod_version') ? project.mod_version : '2.8.2'
def modId = project.hasProperty('mod_id') ? project.mod_id : 'mapwriter'
def modName = project.hasProperty('mod_name') ? project.mod_name : 'MapWriter'
def modGroup = project.hasProperty('root_package') ? project.root_package : 'mapwriter'

version = modVersion
group = modGroup
base.archivesName.set(modId)

java.toolchain.languageVersion.set(JavaLanguageVersion.of(8))

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set(project.hasProperty('minecraft_username') ? project.minecraft_username : 'Developer')
}

repositories {
    maven { url 'https://maven.cleanroommc.com' }
    mavenCentral()
}

dependencies {}

processResources {
    inputs.property 'mod_id', modId
    inputs.property 'mod_name', modName
    inputs.property 'mod_version', modVersion
    filesMatching('mcmod.info') {
        expand(
                'mod_id': modId,
                'mod_name': modName,
                'mod_version': modVersion,
                'version': modVersion,
                'mcversion': '1.12.2'
        )
    }
}

jar {
    manifest {
        attributes(
                'ForceLoadAsMod': 'true',
                'ModSide': 'CLIENT'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module { inheritOutputDirs = true }
    project.settings {
        runConfigurations {
            "Run Client"(org.jetbrains.gradle.ext.Gradle) {
                taskNames = ['runClient']
            }
            "Run Server"(org.jetbrains.gradle.ext.Gradle) {
                taskNames = ['runServer']
            }
        }
    }
}